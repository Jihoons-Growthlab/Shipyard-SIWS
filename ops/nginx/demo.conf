# Separate, read-only demo gateway. Add Tailscale Serve and verify access rules
# before issuing invitations. Run with a dedicated Nginx prefix.
worker_processes 1;
pid nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;

    upstream siws_portal {
        server 127.0.0.1:8080;
    }

    server {
        listen 127.0.0.1:18081;
        server_name macbookair.taildb2f9e.ts.net;
        client_max_body_size 64k;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8080;
        proxy_cache off;
        proxy_buffering off;
        proxy_redirect off;

        if ($host != macbookair.taildb2f9e.ts.net) { return 403; }

        location ~ ^/api/(login|logout)$ {
            if ($request_method != POST) { return 405; }
            # Validate the real browser origin before translating for the local Portal.
            if ($http_origin != "https://macbookair.taildb2f9e.ts.net") { return 403; }
            proxy_set_header Host 127.0.0.1:8080;
            proxy_set_header Origin http://127.0.0.1:8080;
            proxy_pass http://siws_portal;
        }

        # The Twin accepts absent geometry rows and uses vessel dimensions.
        # The guest group does not need read access to the design documents menu.
        location = /api/hull_geometry {
            if ($request_method != GET) { return 405; }
            default_type application/json;
            add_header Cache-Control no-store;
            return 200 "[]";
        }

        location ~ ^/api/(meta|me|hulls|vessel_details|blocks|block_details|activities|erection_plans|erection_records|erection_links|block_gate_checks|block_stock_plans|block_stages|hull_overview|hull_placements|erection_timeline|yard_sites|location_geo|shift_points|crane_assignments|crane_rails|crane_kinematics|crane_load_charts|crane_activity|center_locations|dock_bookings|berth_assignments|quay_shifts|berth_occupancy|hull_milestones|outfit_works)$ {
            if ($request_method != GET) { return 405; }
            proxy_pass http://siws_portal;
        }

        location ~ ^/(control/?|config|apps\.json|process-guide/?|shipyard-icon\.png|yard-hero\.jpg|twin-preview\.png|production-control\.jpg|equipment-monitoring\.jpg)?$ {
            if ($request_method != GET) { return 405; }
            proxy_pass http://siws_portal;
        }

        location ^~ /twin/ {
            if ($request_method != GET) { return 405; }
            proxy_pass http://siws_portal;
        }

        location / {
            return 404;
        }
    }
}
