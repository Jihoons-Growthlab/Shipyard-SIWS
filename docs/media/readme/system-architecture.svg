<g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif">
<text x="26" y="39" text-anchor="start" font-size="27" font-weight="700" fill="#132946">한 화면에서 조선소 업무를 연결</text><text x="26" y="67" text-anchor="start" font-size="18" font-weight="400" fill="#344a65">포털에서 업무를 보고, ERP에서 읽은 계획을 Unity에서 재생합니다.</text><path d="M266 161H311" fill="none" stroke="#526783" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M570 161H615" fill="none" stroke="#526783" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M440 214V226 M440 252V266" fill="none" stroke="#526783" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M742 266V253 M742 226V214" fill="none" stroke="#526783" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M140 214V226 M140 252V266" fill="none" stroke="#526783" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="24" y="99" width="238" height="112" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="39" y="114" width="45" height="45" rx="11" fill="#e0eeff"/><g transform="translate(47 122) scale(.9)" fill="none" stroke="#245bc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="26" height="18" rx="3"/><path d="M3 9h26M16 22v5m-6 0h12"/></g><text x="96" y="143" text-anchor="start" font-size="23" font-weight="700" fill="#132946">운영 포털</text><text x="41" y="183" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">관제 · 지도 · WebGL 진입</text><rect x="318" y="99" width="244" height="112" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="333" y="114" width="45" height="45" rx="11" fill="#daf4ed"/><g transform="translate(341 122) scale(.9)" fill="none" stroke="#147966" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="24" height="10" rx="2"/><rect x="4" y="18" width="24" height="10" rx="2"/><path d="M9 9h1m5 0h8M9 23h1m5 0h8"/></g><text x="390" y="143" text-anchor="start" font-size="23" font-weight="700" fill="#132946">생산관리 ERP</text><text x="335" y="183" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">호선 · 블록 · 생산계획</text><rect x="618" y="99" width="238" height="112" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="633" y="114" width="45" height="45" rx="11" fill="#ede6ff"/><g transform="translate(641 122) scale(.9)" fill="none" stroke="#6647b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 12 7v13l-12 7-12-7V10zM4 10l12 7 12-7M16 17v13m-6-23 12 7"/></g><text x="690" y="143" text-anchor="start" font-size="23" font-weight="700" fill="#132946">Unity 트윈</text><text x="635" y="183" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">운반 · 탑재 · 야드 재생</text><text x="440" y="246" text-anchor="middle" font-size="17" font-weight="400" fill="#344a65">업무 저장소</text><text x="140" y="246" text-anchor="middle" font-size="17" font-weight="400" fill="#344a65">장비 모의 관측</text><text x="742" y="246" text-anchor="middle" font-size="17" font-weight="400" fill="#344a65">오프라인 실행</text><rect x="24" y="271" width="238" height="112" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="39" y="286" width="45" height="45" rx="11" fill="#e0eeff"/><g transform="translate(47 294) scale(.9)" fill="none" stroke="#245bc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v23h23M8 21l6-7 5 3 8-10"/></g><text x="96" y="315" text-anchor="start" font-size="23" font-weight="700" fill="#132946">InfluxDB</text><text x="41" y="355" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">장비 관측 이력</text><rect x="318" y="271" width="244" height="112" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="333" y="286" width="45" height="45" rx="11" fill="#daf4ed"/><g transform="translate(341 294) scale(.9)" fill="none" stroke="#147966" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7" rx