<svg xmlns="http://www.w3.org/2000/svg" width="880" height="403" viewBox="0 0 880 403" role="img" aria-labelledby="title">
<title id="title">제품 안의 조선소 도우미</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0l6 3-6 3z" fill="#526783"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="402" rx="20" fill="#f4f7fc" stroke="#d5dfed"/>
<g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif">
<text x="26" y="39" text-anchor="start" font-size="27" font-weight="700" fill="#132946">제품 안의 조선소 도우미</text><text x="26" y="67" text-anchor="start" font-size="18" font-weight="400" fill="#344a65">호선의 다음 일정이 궁금할 때 답변까지 이어지는 흐름입니다.</text><rect x="24" y="94" width="381" height="126" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="39" y="109" width="45" height="45" rx="11" fill="#e0eeff"/><g transform="translate(47 117) scale(.9)" fill="none" stroke="#245bc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h20a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H14l-7 5v-5H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3zM9 14h14"/></g><text x="96" y="138" text-anchor="start" font-size="23" font-weight="700" fill="#132946">포털에서 질문</text><text x="41" y="178" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">“SN2055 다음 일정은?”</text><rect x="475" y="94" width="381" height="126" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="490" y="109" width="45" height="45" rx="11" fill="#ede6ff"/><g transform="translate(498 117) scale(.9)" fill="none" stroke="#6647b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4a8 8 0 0 0-9 10L4 21a4 4 0 0 0 6 6l7-7a8 8 0 0 0 10-9l-5 5-5-5z"/></g><text x="547" y="138" text-anchor="start" font-size="23" font-weight="700" fill="#132946">ERP 조회 함수 선택</text><text x="492" y="178" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">FastAPI · FastMCP</text><text x="492" y="202" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">Ollama 모델이 필요한 조회를 요청</text><rect x="24" y="253" width="381" height="126" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="39" y="268" width="45" height="45" rx="11" fill="#daf4ed"/><g transform="translate(47 276) scale(.9)" fill="none" stroke="#147966" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7" rx="11" ry="4"/><path d="M5 7v18c0 5 22 5 22 0V7M5 16c0 5 22 5 22 0"/></g><text x="96" y="297" text-anchor="start" font-size="23" font-weight="700" fill="#132946">내 권한으로 ERP 조회</text><text x="41" y="337" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">호선 일정과 선석 배정 확인</text><text x="41" y="361" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">ERP가 사용자 조회 권한 확인</text><rect x="475" y="253" width="381" height="126" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="490" y="268" width="45" height="45" rx="11" fill="#ffedd5"/><g transform="translate(498 276) scale(.9)" fill="none" stroke="#99510b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="24" height="24" rx="5"/><path d="m10 16 4 4 8-9"/></g><text x="547" y="297" text-anchor="start" font-size="23" font-weight="700" fill="#132946">근거와 함께 답변</text><text x="492" y="337" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">ERP 조회 결과를 요약</text><text x="492" y="361" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">호선 일정과 관련 화면 링크 제공</text><path d="M412 155H468" fill="none" stroke="#526783" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M851 226V235H31V246" fill="none" stroke="#526783" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M412 315H468" fill="none" stroke="#526783" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</g>
</svg>
