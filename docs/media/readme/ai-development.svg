<text x="26" y="39" text-anchor="start" font-size="27" font-weight="700" fill="#132946">개발에 사용한 AI</text><text x="26" y="67" text-anchor="start" font-size="18" font-weight="400" fill="#344a65">요구사항을 나누고, 코드와 검증 결과를 함께 검토합니다.</text><rect x="24" y="94" width="381" height="126" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="39" y="109" width="45" height="45" rx="11" fill="#e0eeff"/><g transform="translate(47 117) scale(.9)" fill="none" stroke="#245bc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h12l6 6v20H7zM18 3v8h7M11 16h10m-10 5h10"/></g><text x="96" y="138" text-anchor="start" font-size="23" font-weight="700" fill="#132946">작업 범위 정리</text><text x="41" y="178" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">AGENTS.md · API 계약 확인</text><text x="41" y="202" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">수정할 앱과 완료 조건 결정</text><rect x="475" y="94" width="381" height="126" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="490" y="109" width="45" height="45" rx="11" fill="#ede6ff"/><g transform="translate(498 117) scale(.9)" fill="none" stroke="#6647b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 9-7 7 7 7m10-14 7 7-7 7M18 5l-4 22"/></g><text x="547" y="138" text-anchor="start" font-size="23" font-weight="700" fill="#132946">역할을 나눠 구현</text><text x="492" y="178" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">Claude · UI와 상호작용</text><text x="492" y="202" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">Codex · 데이터 연동과 통합 검증</text><rect x="24" y="253" width="381" height="126" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="39" y="268" width="45" height="45" rx="11" fill="#daf4ed"/><g transform="translate(47 276) scale(.9)" fill="none" stroke="#147966" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="24" height="24" rx="5"/><path d="m10 16 4 4 8-9"/></g><text x="96" y="297" text-anchor="start" font-size="23" font-weight="700" fill="#132946">교차 리뷰와 검증</text><text x="41" y="337" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">API 호출부 · 좌표 · 일정 확인</text><text x="41" y="361" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">ERP 드라이런 · Unity 테스트</text><rect x="475" y="253" width="381" height="126" rx="14" fill="#fff" stroke="#d5dfed"/><rect x="490" y="268" width="45" height="45" rx="11" fill="#ffedd5"/><g transform="translate(498 276) scale(.9)" fill="none" stroke="#99510b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v23h23M8 21l6-7 5 3 8-10"/></g><text x="547" y="297" text-anchor="start" font-size="23" font-weight="700" fill="#132946">화면과 결과 확인</text><text x="492" y="337" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">같은 카메라 조건으로 화면 비교</text><text x="492" y="361" text-anchor="start" font-size="19" font-weight="400" fill="#344a65">변경과 검증 결과를 기록</text><path d="M412 155H468" fill="none" stroke="#526783" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M851 226V235H31V246" fill="none" stroke="#526783" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M412 315H468" fill="none" stroke="#526783" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
