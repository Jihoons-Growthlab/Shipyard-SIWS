services:
  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: siws
      DOCKER_INFLUXDB_INIT_PASSWORD: ${SIWS_INFLUX_PASSWORD:?Set SIWS_INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${SIWS_INFLUX_TOKEN:?Set SIWS_INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_ORG: siws
      DOCKER_INFLUXDB_INIT_BUCKET: equipment
      DOCKER_INFLUXDB_INIT_RETENTION: 168h
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  influx-data:
  influx-config:
