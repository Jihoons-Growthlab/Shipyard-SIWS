function alongRoute(asset, position) {
  const points = asset.yard, step = Math.min(1, Math.max(0, position)) * (points.length - 1);
  const index = Math.min(Math.floor(step), points.length - 2), fraction = step - index;
  const [start, end] = points.slice(index, index + 2);
  return {x:start[0] + (end[0] - start[0]) * fraction, y:start[1] + (end[1] - start[1]) * fraction,
    bearing:Math.atan2(end[1] - start[1], end[0] - start[0])};
}
function locationForSample(asset, position) {
  const {x, y} = alongRoute(asset, position);
  return yardToGeo(x, y);
}

// Goliath/gantry crane from above: the girder spans the dock (across its axis) on two legs, the trolley on it.
function craneParts(asset, position) {
  const {x, y, bearing} = alongRoute(asset, position), f = asset.facility;
  const a = asset.rail ? bearing : (f.heading_deg || 0) * Math.PI / 180;
  const span = asset.rail ? asset.gauge / 2 : f.size_y_m / 2 + 9;
  const at = (u, v) => yardToGeo(x + u * Math.cos(a) - v * Math.sin(a), y + u * Math.sin(a) + v * Math.cos(a));
  const box = (u0, u1, v0, v1) => [at(u0,v0), at(u1,v0), at(u1,v1), at(u0,v1)];
  return {girder:box(-4.5, 4.5, -span, span), legs:[box(-7, 7, -span - 3, -span + 3), box(-7, 7, span - 3, span + 3)],
    trolley:box(-6, 6, span * .1, span * .1 + 11), shadow:shadowed(box(-4.5, 4.5, -span, span), 40)};
}
function craneRails(asset) {
  const f = asset.facility, span = f.size_y_m / 2 + 9, [first, last] = [asset.yard[0], asset.yard[asset.yard.length - 1]];
  const a = (f.heading_deg || 0) * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a);
  const ends = [[first, -14], [last, 14]].map(([[x, y], extra]) => [x + ux * extra, y + uy * extra]);
  return [-span, span].map(v => ends.map(([x, y]) => yardToGeo(x - v * uy, y + v * ux)));
}
// Rail-mounted jib crane from above: the portal frame on its two rails, the boom turned to its slew angle (the
// observed or replayed one, else its jib direction) and as long as its hook radius (boom · cos(boom angle)).
function railCraneParts(asset, position, pose = null) {
  const {x, y, bearing} = alongRoute(asset, position), g = asset.gauge / 2;
  const slew = pose?.slew ?? asset.jib, a = slew * Math.PI / 180;
  const radius = pose?.luff != null && asset.boom ? asset.boom * Math.cos(pose.luff * Math.PI / 180) : asset.reach;
  const ux = Math.cos(bearing), uy = Math.sin(bearing);
  const at = (u, v) => yardToGeo(x + u * ux - v * uy, y + u * uy + v * ux);
  const jx = Math.cos(a), jy = Math.sin(a);
  const jib = (w, l0, l1) => [[l0, -w], [l1, -w], [l1, w], [l0, w]].map(([l, s]) => yardToGeo(x + l * jx - s * jy, y + l * jy + s * jx));
  return {portal:[at(-g, -g), at(g, -g), at(g, g), at(-g, g)], jib:jib(1.2, 0, radius), counter:jib(2.5, -12, -4),
    shadow:shadowed(jib(1.2, 0, radius), 30), hook:yardToGeo(x + radius * jx, y + radius * jy)};
}
function railLines(asset) {
  const [[x0, y0], [x1, y1]] = asset.yard, g = asset.gauge / 2, b = Math.atan2(y1 - y0, x1 - x0);
  const nx = -Math.sin(b), ny = Math.cos(b), ex = Math.cos(b) * 6, ey = Math.sin(b) * 6;
  return [-g, g].map(v => [yardToGeo(x0 - ex + nx * v, y0 - ey + ny * v), yardToGeo(x1 + ex + nx * v, y1 + ey + ny * v)]);
}
const isJib = asset => ['dockJib', 'quayJib'].includes(asset.model);

function updateCrane(asset, position, pose = null) {
  if (isJib(asset)) {
    const parts = railCraneParts(asset, position, pose), drawn = asset.drawn;
    if (!drawn) return;
    for (const key of ['shadow', 'portal', 'jib', 'counter']) drawn[key].setLatLngs(parts[key]);
    drawn.hook?.setLatLng(parts.hook);
    return;
  }
  const parts = craneParts(asset, position), drawn = asset.drawn;
  if (!drawn) return;
  drawn.shadow.setLatLngs(parts.shadow);
  drawn.girder.setLatLngs(parts.girder);
  drawn.trolley.setLatLngs(parts.trolley);
  drawn.legs.forEach((leg, i) => leg.setLatLngs(parts.legs[i]));
}

const VEHICLE_ICONS = {
  transporter:'<rect x="3" y="11" width="28" height="12" rx="2" fill="#f2b632" stroke="#5b4510"/><rect x="24" y="12" width="6" height="10" rx="1" fill="#3a3f44"/>' +
    '<g fill="#22272b"><rect x="5" y="9" width="4" height="2"/><rect x="12" y="9" width="4" height="2"/><rect x="19" y="9" width="4" height="2"/><rect x="5" y="23" width="4" height="2"/><rect x="12" y="23" width="4" height="2"/><rect x="19" y="23" width="4" height="2"/></g>',
  transporterLoaded:'<rect x="3" y="11" width="28" height="12" rx="2" fill="#f2b632" stroke="#5b4510"/><rect x="5" y="9" width="17" height="16" rx="1" fill="#b55c43" stroke="#5d2a1c"/><rect x="24" y="12" width="6" height="10" rx="1" fill="#3a3f44"/>',
  forklift:'<rect x="9" y="11" width="15" height="12" rx="3" fill="#ef7d22" stroke="#6b3307"/><rect x="11" y="13" width="7" height="8" rx="1.5" fill="#2b3237"/><rect x="24" y="12" width="7" height="2" fill="#30363b"/><rect x="24" y="20" width="7" height="2" fill="#30363b"/>',
  pickup:'<rect x="5" y="11" width="24" height="12" rx="3.5" fill="#f4f6f7" stroke="#4f5961"/><rect x="18" y="12.5" width="6" height="9" rx="1.5" fill="#33414c"/><rect x="7" y="13" width="9" height="8" rx="1" fill="#d4dade"/>',
  truck:'<rect x="3" y="10" width="20" height="14" rx="1.5" fill="#e9ecee" stroke="#4f5961"/><rect x="23" y="11" width="8" height="12" rx="2.5" fill="#2f6fa3" stroke="#1f3f5c"/><rect x="27" y="12.5" width="3" height="9" rx="1" fill="#1d2a33"/>',
};
function vehicleSvg(asset) {
  const kind = asset.model === 'transporter' ? (asset.load > 0 ? 'transporterLoaded' : 'transporter') : VEHICLE_ICONS[asset.model] ? asset.model : 'truck';
  return `<svg viewBox="0 0 34 34" aria-hidden="true">${VEHICLE_ICONS[kind]}</svg>`;
}
// Screen rotation of a yard bearing (Leaflet's screen y grows southward).
function screenAngle(bearing) {
  const [lat0, lon0] = yardToGeo(0, 0), [lat1, lon1] = yardToGeo(Math.cos(bearing), Math.sin(bearing));
  return Math.atan2(-(lat1 - lat0), (lon1 - lon0) * Math.cos(lat0 * Math.PI / 180)) * 180 / Math.PI;
}
function placeAsset(asset, position) {
  const marker = assetMarkers.get(asset.id);
  if (asset.kind === 'crane') updateCrane(asset, position, latestSamples.get(asset.id));
  if (!marker) return;
  const where = alongRoute(asset, position);
  marker.setLatLng(yardToGeo(where.x, where.y));
  const svg = marker.getElement()?.querySelector('svg');
  if (svg) svg.style.transform = `rotate(${screenAngle(where.bearing).toFixed(1)}deg)`;
}

function renderAssetDetails() {
  const facts = $('asset-facts');
  facts.replaceChildren();
  if (!selectedAsset) return;
  const sample = sensorPinned || latestSamples.get(selectedAsset.id);
  const values = [['장비 ID', selectedAsset.id], ['작업 구역', selectedAsset.area]];
  if (sample) {
    if (sample.source === 'erp_plan') {
      values.push(['위치 출처', 'ERP 크레인 배정 기준'], ['상태', sample.state],
        ['작업', sample.work ? `${sample.work} · ${sample.hull} · ${sample.assignment}${sample.lift ? ' · ' + sample.lift + '회째 인양' : ''}` : '배정 작업 없음(대기)'],
        ['하중', sample.load ? sample.load + ' t (의장품)' : '없음']);
      if (sample.motion === 'estimated' && sample.work) values.push(['인양 지점', '추정(crane_lifts)']);
    } else values.push(['위치 출처', sensorPinned ? '과거 위치 · 모의 계측' : '모의 계측'], ['상태', sample.state], ['속도', sample.speed + ' km/h'],
      ['하중', sample.load + ' t'], ['출처', '서버 모의']);
    if (sample.hook !== null) values.push(['훅 높이', sample.hook + ' m (안벽 기준)']);
    if (sample.slew != null) {
      const boom = selectedAsset.boom;
      values.push(['선회각', sample.slew.toFixed(1) + '°'], ['붐 각도', sample.luff.toFixed(1) + '°' +
        (boom ? ` · 작업 반경 ${(boom * Math.cos(sample.luff * Math.PI / 180)).toFixed(1)} m` : '')]);
    }
  } else values.push(['위치 출처', selectedAsset.observed ? '모의 계측 · 수신 대기' : 'ERP 배치 시설 기준'],
    ['상태', selectedAsset.observed ? '수신 대기' : '관측 장치 미연결 (ERP 등록 장비)']);
  for (const [key,value] of values) facts.append(node('dt',key),node('dd',value));
}

async function loadObservations(kind) {
  const revision = collectionRevision;
  const response = await fetch('/equipment/observations/' + kind, {
    headers: token ? {Authorization:'Bearer ' + token} : {},
    signal: AbortSignal.timeout(6000)
  });
  if (!response.ok) throw new Error(response.status === 401 ? '다시 로그인해 주세요.' : '관측 기록 조회 지연');
  const result = await response.json();
  const {observations} = result;
  if (kind !== assetKind || revision !== collectionRevision || collectionPending) return;
  collecting = result.collecting;
  $('collection-toggle').hidden = !result.can_manage_collection;
  updateCollectionButton();
  latestSamples = new Map();
  const rows = [];
  for (const sample of observations) {
    if (!latestSamples.has(sample.asset_id)) latestSamples.set(sample.asset_id, sample);
    const row = document.createElement('tr');
    row.append(node('td',new Date(sample.observed_at).toLocaleTimeString('ko-KR',{hour12:false})),
      node('td',sample.asset_id),node('td',sample.state),
      node('td',sample.hook === null ? sample.speed + ' km/h' : sample.load + ' t · 훅 ' + sample.hook + ' m'));
    rows.push(row);
  }
  $('asset-log').replaceChildren(...rows);
  // Rail jib cranes: the ERP crane plan now (GET /api/crane_activity, the same state the twin shows), whether or not the
  // feed is collecting: working only inside their ERP crane assignments, otherwise parked with nothing on the hook.
  if (kind === 'crane') {
    try {
      const live = await api('crane_activity');
      for (const crane of live.cranes) {
        latestSamples.set(crane.id, {asset_id:crane.id, observed_at:live.time, kind:'crane', source:'erp_plan',
          position:crane.rail_pos, state:crane.state, speed:0, load:Math.round(crane.load_t), hook:Math.round(crane.hook.z - 12),
          slew:crane.slew_deg, luff:crane.luff_deg, work:crane.work, assignment:crane.assignment, hull:crane.hull,
          lift:crane.lift_no ? `${crane.lift_no}/${crane.lifts}` : null, motion:crane.source, basis:crane.job_basis});
      }
    } catch { /* older ERP or no permission: the feed values stay */ }
  }
  for (const asset of assetsByCategory()) {
    const sample = latestSamples.get(asset.id);
    if (sample && !(sensorPinned && asset === selectedAsset)) placeAsset(asset, sample.position);
  }
  renderAssetDetails();
  const latest = observations[0];
  const age = latest ? Math.max(0, Math.floor((Date.now() - Date.parse(latest.observed_at)) / 1000)) : null;
  $('signal').textContent = !collecting ? '○ 수집 중지' : age === null ? '○ 관측값 대기' :
    (age < 5 ? '● LIVE' : '○ 수신 지연') + ' · 서버 모의 · ' + age + '초 전';
}

async function pollObservations() {
  const kind = assetKind;
  try {
    await loadObservations(kind);
  } catch (error) {
    if (kind === assetKind) $('signal').textContent = '○ ' + error.message;
  } finally {
    refreshSensorHistory();
    setTimeout(pollObservations, 1000);
  }
}

// History is separate from the rolling category log. Selecting a point pins only that asset.
let sensorSamples = [], sensorPinned = null, sensorRequest = null, sensorNext = 0, planRequest = 0;
const sensorClock = new Intl.DateTimeFormat('ko-KR', {timeZone:'Asia/Seoul', hour:'2-digit', minute:'2-digit',
  second:'2-digit', hourCycle:'h23'});
const sensorTime = value => sensorClock.format(new Date(value));
const sensorSvg = (tag, attrs) => {
  const element = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
  return element;
};

function drawSensorHistory() {
  const graph = $('asset-graph');
  graph.replaceChildren();
  const current = sensorPinned || sensorSamples.at(-1);
  $('sensor-controls').hidden = !current;
  if (!current) return;
  const fields = assetKind === 'crane' ? [['load','하중','t'],['hook','훅 높이','m']]
    : assetKind === 'heavy' ? [['speed','속도','km/h'],['load','적재 하중','t']]
    : [['speed','속도','km/h']];
  const first = Date.parse(sensorSamples[0]?.observed_at ?? current.observed_at);
  const end = Date.parse(sensorSamples.at(-1)?.observed_at ?? current.observed_at);
  const x = sample => 4 + 312 * (Date.parse(sample.observed_at) - first) / Math.max(1000,end - first);
  for (const [field,label,unit] of fields) {
    const figure = node('figure');
    const caption = node('figcaption');
    const max = Math.max(1,...sensorSamples.map(sample => sample[field] ?? 0));
    caption.append(node('span', label + ' (' + unit + ')'),
      node('span', current[field] == null ? '미수신' : current[field] + ' ' + unit));
    const svg = sensorSvg('svg',{viewBox:'0 0 320 60',role:'img','aria-label':label + ' · 0~' + max + ' ' + unit});
    let previous = NaN, path = '';
    for (const sample of sensorSamples) {
      if (!Number.isFinite(sample[field])) { previous = NaN; continue; }
      const time = Date.parse(sample.observed_at);
      path += `${time - previous <= 3500 ? 'L' : 'M'}${x(sample).toFixed(1)} ${(55 - sample[field] / max * 50).toFixed(1)} `;
      previous = time;
    }
    svg.append(sensorSvg('path',{d:path,fill:'none',stroke:'#087e8b','stroke-width':2}));
    if (x(current) >= 4 && x(current) <= 316) {
      svg.append(sensorSvg('line',{x1:x(current),x2:x(current),y1:3,y2:57,stroke:'#5d7382','stroke-dasharray':'3 3'}));
      if (Number.isFinite(current[field])) svg.append(sensorSvg('circle',{cx:x(current),
        cy:Math.max(5,55 - current[field] / max * 50),r:3,fill:'#087e8b'}));
    }
    svg.addEventListener('click', event => {
      const point = svg.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      const target = point.matrixTransform(svg.getScreenCTM().inverse()).x;
      if (!sensorSamples.length) return;
      const nearest = sensorSamples.reduce((best, sample) => Math.abs(x(sample)-target) < Math.abs(x(best)-target) ? sample : best);
      selectSensorSample(nearest);
    });
    figure.append(caption,svg);
    graph.append(figure);
  }
  const slider = $('sensor-time');
  const index = sensorSamples.findIndex(sample => sample.observed_at === current.observed_at);
  slider.max = Math.max(0,sensorSamples.length - 1);
  slider.disabled = !sensorSamples.length;
  slider.value = index >= 0 ? index : slider.max;
  slider.setAttribute('aria-valuetext', sensorTime(current.observed_at));
  $('sensor-readout').textContent = (sensorPinned ? '지도에 표시 중 · ' : '최신 표본 · ') +
    sensorTime(current.observed_at) + ' · ' + current.state;
  $('sensor-latest').hidden = !sensorPinned;
}

async function showSensorPlan(asset, sample) {
  const ticket = ++planRequest;
  const label = $('sensor-plan');
  if (asset.kind !== 'crane' || !asset.erpEquipment) {
    label.textContent = asset.erpEquipment ? '' : 'ERP 장비 연결 없음';
    return;
  }
  label.textContent = 'ERP 예정 작업 조회 중…';
  try {
    const when = Date.parse(sample.observed_at);
    const day = new Date(when + 9 * 3600000).toISOString().slice(0,10);
    const params = new URLSearchParams({'f.equipment':asset.erpEquipment,date_key:'work_day',from:day,until:day,size:'200'});
    const result = await api('crane_assignments?' + params);
    if (ticket !== planRequest) return;
    const jobs = result.rows.filter(row => {
      const start = Date.parse(row.work_day + 'T00:00:00+09:00') + row.start_hour * 3600000;
      return row.equipment === asset.erpEquipment && when >= start && when < start + row.hours * 3600000;
    });
    label.textContent = jobs.length ? 'ERP 예정 작업 · ' + jobs.map(job =>
      [job.crane_work,job.hull,job.block,job.work_area].filter(Boolean).join(' · ')).join(' / ') :
      'ERP 예정 작업 · 이 시각에 확인된 배정 없음';
  } catch {
    if (ticket === planRequest) label.textContent = 'ERP 예정 작업 조회 불가';
  }
}

function selectSensorSample(sample) {
  if (!selectedAsset || !sample) return;
  sensorPinned = sample;
  placeAsset(selectedAsset, sample.position);
  map.panInside(locationForSample(selectedAsset, sample.position));
  renderAssetDetails();
  drawSensorHistory();
  showSensorPlan(selectedAsset, sample);
}

$('sensor-time').addEventListener('change', event => selectSensorSample(sensorSamples[Number(event.target.value)]));
$('sensor-latest').onclick = () => {
  sensorPinned = null;
  const sample = latestSamples.get(selectedAsset?.id) || sensorSamples.at(-1);
  if (sample) placeAsset(selectedAsset, sample.position);
  renderAssetDetails();
  drawSensorHistory();
  ++planRequest;
  $('sensor-plan').textContent = '';
};

function resetSensorHistory() {
  sensorRequest?.abort();
  sensorRequest = null;
  sensorNext = 0;
  sensorPinned = null;
  sensorSamples = [];
  ++planRequest;
  $('sensor-plan').textContent = '';
  $('sensor-status').textContent = selectedAsset?.observed ? '관측 이력 조회 중…' : '수집 연결이 없는 장비입니다.';
  drawSensorHistory();
  refreshSensorHistory();
}

async function refreshSensorHistory() {
  const asset = selectedAsset;
  if (!asset?.observed || sensorRequest || Date.now() < sensorNext) return;
  const controller = new AbortController();
  sensorRequest = controller;
  const timeout = setTimeout(() => controller.abort(), 6000);
  try {
    const response = await fetch('/equipment/history/' + encodeURIComponent(asset.id), {
      headers: token ? {Authorization:'Bearer ' + token} : {}, signal: controller.signal
    });
    if (!response.ok) throw new Error('관측 이력을 불러오지 못했습니다.');
    const result = await response.json();
    if (sensorRequest !== controller) return;
    sensorSamples = result.observations;
    $('sensor-status').textContent = sensorSamples.length ? sensorTime(sensorSamples[0].observed_at) + ' – ' +
      sensorTime(sensorSamples.at(-1).observed_at) + ' KST' : '최근 10분에 저장된 표본이 없습니다.';
    drawSensorHistory();
  } catch {
    if (sensorRequest === controller) $('sensor-status').textContent = '관측 이력을 불러오지 못했습니다.';
  } finally {
    clearTimeout(timeout);
    if (sensorRequest === controller) {
      sensorRequest = null;
      sensorNext = Date.now() + 8000;
    }
  }
}

// 360° viewer: loaded on first use; shows the model for the selected equipment's ERP type.

      size = [asset.id.length * 7 + 20, 22]; anchor = [size[0] / 2, 30];
    } else if (asset.kind === 'crane') {
      for (const rail of asset.rail ? railLines(asset) : craneRails(asset)) L.polyline(rail, {pane:'equipment', color:'#3c4349', weight:2.2, opacity:.85, interactive:false}).addTo(assetLayer);
      const parts = craneParts(asset, position), solid = {pane:'equipment', interactive:false, fillOpacity:1, weight:1};
      asset.drawn = {
        shadow:L.polygon(parts.shadow, {...solid, stroke:false, fillColor:'#0f1d28', fillOpacity:.28}).addTo(assetLayer),
        legs:parts.legs.map(leg => L.polygon(leg, {...solid, color:'#5c1d16', fillColor:'#c8392b'}).addTo(assetLayer)),
        girder:L.polygon(parts.girder, {...solid, color:active ? '#b8761c' : '#56616a', weight:active ? 2.5 : 1, fillColor:'#f5f5f2'}).addTo(assetLayer),
        trolley:L.polygon(parts.trolley, {...solid, color:'#5c1d16', fillColor:'#d8402f'}).addTo(assetLayer),
      };
      html = `<span class="tag">${asset.id}</span>`;
      size = [asset.id.length * 7 + 20, 22]; anchor = [size[0] / 2, 30];
    } else {
      L.polyline(asset.points, {pane:'equipment', color:colour, weight:active ? 3.5 : 2, opacity:active ? .95 : .7,
        dashArray:active ? null : '5 6', lineCap:'round', interactive:false}).addTo(assetLayer);
      html = vehicleSvg(asset) + `<span class="tag">${asset.id}</span>`;
      size = [Math.max(48, asset.id.length * 7 + 20), 56]; anchor = [size[0] / 2, 17];
    }
    const icon = L.divIcon({className:'asset-marker' + (active ? ' active' : asset.observed ? '' : ' idle'), html, iconSize:size, iconAnchor:anchor});
    const marker = L.marker(locationForSample(asset, position),{icon,title:asset.name,alt:asset.name,zIndexOffset:active ? 500 : 200})
      .addTo(assetLayer);
    marker.on('click',() => showAssetCategory(asset));
    assetMarkers.set(asset.id,marker);
    placeAsset(asset, position);
  }
  list.scrollTop = scrollTop;
  if (selectedButton) {
    const viewport = list.getBoundingClientRect();
    const button = selectedButton.getBoundingClientRect();
    if (button.top < viewport.top) list.scrollTop += button.top - viewport.top - 3;
    else if (button.bottom > viewport.bottom) list.scrollTop += button.bottom - viewport.bottom + 3;
    if (restoreFocus) selectedButton.focus({preventScroll:true});
  }
  resetSensorHistory();
  renderAssetDetails();
  showModel(selectedAsset);
}

// spec: the ERP unit this asset is (linked); else typeSpec: an ERP unit of the same type whose rating it shares.
function describe(asset, spec, typeSpec = null) {
  const rated = spec || typeSpec;
  const type = rated?.equipment_type || asset.erp;
  const atQuay = layout.get(rated?.station)?.kind === '안벽' || asset.id.startsWith('LC-');
  const model = asset.model || (type === '지브 크레인' && atQuay ? 'quayJib' : MODEL_BY_TYPE[type]) || 'truck';
  const label = asset.label || (rated ? `${rated.equipment_type} ${rated.capacity_t} t` : asset.erp || asset.name);
  const chips = spec
    ? [`ERP ${spec.equipment}`, spec.equipment_type, `정격 ${spec.capacity_t} t`, ...(spec.station ? [`배치 ${layout.get(spec.station)?.name || spec.station}`] : [])]
    : typeSpec ? [typeSpec.equipment_type, `정격 ${typeSpec.capacity_t} t (ERP 동형 기준)`, 'ERP 개별 등록 없음']
    : [asset.erp ? `ERP ${asset.erp} 미등록` : 'ERP 미등록 차량', '모의 장비'];
  return {model, modelLabel: label, chips, erpEquipment: spec?.equipment ?? null};
}

function startEquipmentMonitor(layout) {
  assetLayer = L.layerGroup().addTo(map);
  const used = new Set();
  const route = (area, offsets) => offsets.map(([dx,dy]) => local(area, dx, dy));
  const placed = demoAssets.flatMap(asset => {
    const area = layout.get(asset.facility)
      || Array.from(layout.values()).find(item => item.kind === asset.fallback);
    return area && Number.isFinite(area.x) && Number.isFinite(area.y) ? [{asset, area}] : [];
  });
  // Link each observed asset to the ERP unit it is: one of its type stationed at its facility, else in its area.
  const links = new Map();
  for (const sameArea of [false, true]) {
    for (const {asset, area} of placed) {
      if (!asset.erp || links.has(asset.id)) continue;
      const spec = equipmentSpecs.find(s => s.equipment_type === asset.erp && !used.has(s.equipment) &&
        !['DT-PE-TP', 'GY-PE2-TP'].includes(s.equipment) &&
        (sameArea ? s.station && zoneOf(s.station) === zoneOf(area.location) : s.station === area.location));
      if (spec) { links.set(asset.id, spec); used.add(spec.equipment); }
    }
  }
  const observed = placed.map(({asset, area}) => {
    const spec = links.get(asset.id), typeSpec = spec ? null : equipmentSpecs.find(s => s.equipment_type === asset.erp);
    const yard = route(area, asset.route);
    return {...asset, ...describe(asset, spec, typeSpec), observed:true, yard, points:yard.map(p => yardToGeo(...p)), facility:area, area:DISPLAY_NAMES[area.location] || area.name};
  });
  // ERP equipment without a feed (the added lines): shown at its station, not moving.
  const registered = equipmentSpecs.filter(s => KIND_BY_TYPE[s.equipment_type] && !used.has(s.equipment) && layout.has(s.station)).map(spec => {
    const area = layout.get(spec.station);
    const crane = KIND_BY_TYPE[spec.equipment_type] === 'crane';
    const offsets = crane ? [[-area.size_x_m / 2 + 15, 0], [area.size_x_m / 2 - 15, 0]] : [[-area.size_x_m / 3, 0], [area.size_x_m / 3, 0]];
    const asset = {id:spec.equipment, name:equipmentNames.get(spec.equipment) || spec.equipment,
      kind:KIND_BY_TYPE[spec.equipment_type], erp:spec.equipment_type,
      gauge:10, jib:(area.heading_deg || 0) + 90, reach:28};
    const yard = route(area, offsets);
    return {...asset, ...describe(asset, spec), observed:false, yard, points:yard.map(p => yardToGeo(...p)), facility:area, area:area.name + ' · ' + zoneName(zoneOf(area.location))};
  });
  // Rail cranes registered with their rails in the ERP: observed by the portal feed under their ERP ID.
  const railed = craneRailRows.filter(r => !used.has(r.equipment)).map(row => {
    const station = row.station ? canonical(row.station) : null, area = station && layout.get(station);
    const spec = equipmentSpecs.find(s => s.equipment === row.equipment);
    const asset = {id:row.equipment, name:row.name || row.equipment, kind:'crane', erp:row.equipment_type, rail:true,
      gauge:row.gauge_m, jib:row.jib_heading_deg, reach:row.equipment_type === '지브 크레인' ? 40 : 20, home:railHome(row.equipment),
      boom:craneBooms.get(row.equipment)?.boom_m};
    const yard = [[row.rail_x0, row.rail_y0], [row.rail_x1, row.rail_y1]];
    return {...asset, ...describe(asset, spec), modelLabel:`${row.equipment_type} ${row.capacity_t} t (레일 주행)`, observed:true, yard,
      points:yard.map(p => yardToGeo(...p)), facility:area || null,
      area:area ? (DISPLAY_NAMES[area.location] || area.name) + ' · ' + zoneName(zoneOf(area.location)) : '레일'};
  });
  const railIds = new Set(railed.map(a => a.id));
  monitoredAssets = [...observed, ...registered.filter(a => !railIds.has(a.id)), ...railed];
  for (const button of document.querySelectorAll('[data-kind]')) {
    button.onclick = () => {
      assetKind = button.dataset.kind;
      for (const tab of document.querySelectorAll('[data-kind]')) {
        tab.setAttribute('aria-pressed',String(tab === button));
      }
      $('asset-log').replaceChildren();
      $('signal').textContent = '● 모의 데이터';
      latestSamples = new Map();
      showAssetCategory();
    };
  }
  const linked = monitoredAssets.find(asset => asset.id === linkParams.get('asset'));
  if (linked) {
    assetKind = linked.kind;
    for (const tab of document.querySelectorAll('[data-kind]')) tab.setAttribute('aria-pressed', String(tab.dataset.kind === assetKind));
  }
  showAssetCategory(linked || null);
  if (!monitoredAssets.length) $('signal').textContent = '시설 좌표가 없어 모의 장비를 배치할 수 없습니다.';
  pollObservations();
}

window.addEventListener('hashchange', () => location.reload());

if (monitoring) {
  document.title = '장비 모니터링 · SIWS';
  document.body.classList.add('equipment-mode');
  $('monitor-heading').hidden = false;
  $('monitor-log').hidden = false;
  $('asset-panel').hidden = false;
  $('facility-panel').hidden = true;
  $('legend').hidden = true;
  $('monitor-legend').hidden = false;
}

load().catch(error => {
  $('stats').replaceChildren(node('p', '시설 정보를 표시할 수 없습니다.', 'muted'));
  $('status').textContent = error.message;
  if (monitoring) $('signal').textContent = error.message;
});
</script>
