<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10131a">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131a; overflow: hidden; overscroll-behavior: none; }
    body { color: #e6ebf3; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none;
      background: #10131a; touch-action: none; }
    /* Hoon Heavy Industries intro / loading screen */
    #loading { --teal:#14b8b0; --mint:#73dec2; position: fixed; inset: 0; z-index: 5; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; overflow: hidden;
      padding: 24px; text-align: center; color: #fff; background: #07182a; transition: opacity .7s ease, transform .9s cubic-bezier(.7,0,.2,1), filter .7s; }
    #loading .bg { position: absolute; inset: -4%; background: linear-gradient(180deg,#061626f2 0%,#0a2139c4 45%,#06162ef0 100%), url('/yard-hero.jpg') center/cover no-repeat;
      animation: kenburns 18s ease-in-out infinite alternate; }
    #loading .grid { position: absolute; inset: 0; opacity: .22; background-image: linear-gradient(#73dec22a 1px, transparent 1px), linear-gradient(90deg, #73dec22a 1px, transparent 1px);
      background-size: 48px 48px; mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
      animation: gridpan 6s linear infinite; }
    #loading .scan { position: absolute; left: 0; right: 0; height: 30%; top: -30%; background: linear-gradient(180deg, transparent, #73dec208 70%, #73dec22e 99.5%, transparent);
      animation: scan 4.2s cubic-bezier(.4,0,.6,1) infinite; }
    #loading .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; width: min(520px, 100%); }
    #loading .mark { display: inline-flex; align-items: center; gap: 14px; white-space: nowrap; }
    #loading .mark .word { display: inline-flex; align-items: center; }
    #loading .mark img { width: 64px; height: 64px; object-fit: contain; mix-blend-mode: lighten; opacity: 0; transform: scale(.6) rotate(-12deg); border-radius: 12px;
      animation: pop .9s cubic-bezier(.2,1.4,.4,1) .2s forwards; }
    #loading .mark b { font: italic 700 72px/.86 "Snell Roundhand","Apple Chancery","Brush Script MT",cursive; letter-spacing: -.05em; padding: 0 4px 6px 0;
      color: #fff; opacity: 0; transform: translateX(-22px) skewX(-14deg); animation: write .9s cubic-bezier(.2,.9,.2,1) .6s forwards; }
    #loading .mark i { display: inline-block; font: 750 15px/1.4 system-ui, sans-serif; font-style: normal; letter-spacing: .14em; color: #d6e7ee; padding-left: 14px;
      border-left: 1px solid #9eb2c066; opacity: 0; transform: translateX(26px); animation: track .9s cubic-bezier(.2,.8,.2,1) 1.1s forwards; }
    #loading .mark { position: relative; }
    #loading .mark::after { content: ""; position: absolute; top: -10%; bottom: -10%; left: 0; width: 34%; pointer-events: none;
      background: linear-gradient(100deg, transparent, #ffffff55, transparent); mix-blend-mode: overlay; opacity: 0; animation: sweep 3.6s ease-in-out 2s infinite; }
    #loading .tag { margin: -8px 0 0; font: 600 12px/1 system-ui, sans-serif; letter-spacing: .42em; color: var(--mint); opacity: 0; animation: rise .8s ease 1.6s forwards; }
    #loading .ship { width: min(380px, 84vw); height: auto; overflow: visible; opacity: 0; animation: rise .8s ease 1.6s forwards; }
    #loading .ship .ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s cubic-bezier(.6,0,.2,1) 1.7s forwards; }
    #loading .ship .ln.d2 { animation-delay: 2.1s; }
    #loading .ship .blk { fill: #73dec2; fill-opacity: 0; stroke: #73dec2; stroke-opacity: .28; stroke-width: .8; transition: fill-opacity .5s ease, stroke-opacity .5s ease; }
    #loading .ship .blk.on { fill-opacity: .2; stroke-opacity: .9; }
    #loading .ship .blk.on.lit { fill-opacity: .55; }
    #loading .ship .sweep { animation: sweep-x 3.2s cubic-bezier(.45,0,.55,1) 2.4s infinite; opacity: 0; }
    #loading .ship .wl { stroke-dasharray: 3 5; animation: flow 2.4s linear infinite; }
    #bar { position: relative; width: min(360px, 82vw); height: 3px; border-radius: 2px; background: #ffffff1c; overflow: hidden; opacity: 0; animation: rise .6s ease 2s forwards; }
    #fill { position: relative; width: 0; height: 100%; background: linear-gradient(90deg, var(--teal), var(--mint)); box-shadow: 0 0 12px var(--mint); transition: width .35s ease; }
    #fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #fff9, transparent); animation: shimmer 1.4s linear infinite; }
    #meta { display: flex; justify-content: space-between; width: min(360px, 82vw); margin-top: -12px; font: 500 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
      color: #9fb6c6; letter-spacing: .08em; opacity: 0; animation: rise .6s ease 2.1s forwards; }
    #pct { color: #fff; font-variant-numeric: tabular-nums; }
    #loading a { display: none; color: #fff; text-decoration: none; padding: 10px 18px; border: 1px solid #ffffff40; border-radius: 8px; background: #ffffff10; }
    #loading.failed a { display: inline-block; }
    #loading.failed #bar, #loading.failed .ship { display: none; }
    #loading.failed #detail { color: #ffb4a8; }
    #loading.done { opacity: 0; transform: scale(1.06); filter: blur(6px); pointer-events: none; }
    @keyframes kenburns { from { transform: scale(1) translate(0,0); } to { transform: scale(1.12) translate(-2%,-1%); } }
    @keyframes gridpan { to { background-position: 48px 48px, 48px 48px; } }
    @keyframes scan { to { top: 100%; } }
    @keyframes pop { to { opacity: 1; transform: none; } }
    @keyframes write { to { opacity: 1; transform: none; } }
    @keyframes track { to { opacity: 1; transform: none; } }
    @keyframes sweep { 0% { opacity: 1; transform: translateX(-120%); } 45%, 100% { opacity: 1; transform: translateX(320%); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes sweep-x { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; transform: translateX(330px); } }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    @media (max-width: 560px) { #loading .mark img { width: 44px; height: 44px; } #loading .mark b { font-size: 50px; }
      #loading .mark { gap: 8px; } #loading .mark i { font-size: 10px; padding-left: 8px; } }
    @media (prefers-reduced-motion: reduce) { #loading *, #loading *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; } }

/* SIWS global navigation */
.siws-nav{--nav-text:#42596c;--nav-current:#00616f;--nav-selected:#e7f2f3;--nav-hover:#f0f5f7;display:flex;align-items:center;justify-content:center;gap:2px;min-width:0;max-width:100%;position:static;padding:0;margin:0;border:0;border-radius:0;background:transparent;box-sizing:border-box}
.siws-nav a{display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;min-height:38px;padding:6px 9px;border:0;border-radius:7px;background:transparent;color:var(--nav-text);font:600 13px/1.3 system-ui,sans-serif;text-decoration:none;white-space:nowrap;filter:none;box-shadow:none}
.siws-nav a:hover{background:var(--nav-hover);color:var(--nav-current)}
.siws-nav a[aria-current="page"]{background:var(--nav-selected);color:var(--nav-current);font-weight:700}
.siws-nav a:focus-visible{outline:2px solid #178594;outline-offset:-2px}
.siws-nav svg{width:16px;height:16px;flex:none}

body>header>:is(.hoon-account,#session-bar,#viewer){order:2;width:auto;margin-left:0}

#unity-canvas{top:var(--nav-height);height:calc(100vh - var(--nav-height));height:calc(100dvh - var(--nav-height))}

  <script>
    var canvas = document.getElementById('unity-canvas');
    canvas.addEventListener('contextmenu', function (event) { event.preventDefault(); });
    var loading = document.getElementById('loading');
    var detail = document.getElementById('detail');
    var pct = document.getElementById('pct');
    var started = Date.now();
    var INTRO_MS = 2600;   // let the logo reveal finish even on a cached, instant load
    var blks = document.querySelectorAll('#loading .blk');
    function lightBlocks(progress) {
      var n = Math.round(progress * blks.length);
      for (var i = 0; i < blks.length; i++) {
        blks[i].classList.toggle('on', i < n);
        blks[i].classList.toggle('lit', i === n - 1);
      }
    }
    function fail(message) {
      loading.classList.remove('done');
      loading.classList.add('failed');
      pct.textContent = 'ERROR';
      detail.textContent = '디지털 트윈을 열 수 없습니다 · ' + message;
    }
    var config = {
      arguments: [],
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // Retina phones at 3x render 2.25x the pixels of 2x for little visible gain: cap at 2 (heat, frame rate).
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (message, type) { if (type === 'error') fail(message); else console.warn(message); },
    };
    var script = document.createElement('script');
    script.src = 'Build/{{{ LOADER_FILENAME }}}';
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        var percent = Math.round(progress * 100);
        document.getElementById('fill').style.width = percent + '%';
        pct.textContent = percent + '%';
        lightBlocks(progress);
        detail.textContent = percent < 30 ? '엔진 초기화' : percent < 90 ? '조선소 데이터 수신' : '야드 장면 구성';
      }).then(function () {
        pct.textContent = '100%';
        lightBlocks(1);
        detail.textContent = '준비 완료';
        setTimeout(function () {
          loading.classList.add('done');
          setTimeout(function () { loading.style.display = 'none'; }, 900);
          canvas.focus();
        }, Math.max(400, INTRO_MS - (Date.now() - started)));
      }).catch(function (message) { fail(String(message)); });
    };
    script.onerror = function () { fail('빌드 파일을 불러오지 못했습니다.'); };
    document.body.appendChild(script);
  </script>

<script>
(async function(){
 const account=document.getElementById('twin-account');
 const login=document.getElementById('twin-login');
 const name=document.getElementById('twin-viewer');
 const token=sessionStorage.getItem('shipyard-token');
 if(!token)return;
 try{
  const response=await fetch('/api/me',{headers:{Authorization:'Bearer '+token}});
  if(!response.ok)return;
  const user=await response.json();
  name.textContent=user.name||user.id;
  account.hidden=false;login.hidden=true;
 }catch(error){name.textContent='계정 확인 실패';}
 document.getElementById('twin-logout').onclick=async function(){
  try{
   const response=await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:'{}'});
   if(!response.ok)throw new Error('로그아웃 실패');
   sessionStorage.removeItem('shipyard-token');location.assign('/');
